[program:cups]
command=/usr/sbin/cupsd -f
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:lpr]
command=/usr/bin/socat TCP-LISTEN:515,reuseaddr,fork EXEC:/usr/lib/cups/daemon/cups-lpd
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
